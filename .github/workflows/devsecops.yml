name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs: tags are mutable (trivy-action's
# tags were rewritten after a supply-chain attack, which is what broke the first run).
jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint, types, SAST, SCA, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U aegis -d aegis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis_test
      # Enables tests/test_migrations.py (trigger, constraints, migration round-trip).
      # The service database is disposable; the tests downgrade it to base.
      AEGIS_TEST_DATABASE_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Generate ephemeral test secrets
        # Random per run, so no key material is committed (and nothing for gitleaks to flag).
        run: |
          for name in JWT_SECRET BADGE_HMAC_SECRET MFA_ENCRYPTION_KEY; do
            value="$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "${GITHUB_ENV}"
          done
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy app tests
      - name: Bandit (SAST)
        run: bandit -c pyproject.toml -r app
      - name: pip-audit (SCA)
        run: pip-audit -r requirements.txt --strict
      - name: Pytest with coverage (unit + PostgreSQL integration)
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint, build, SCA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: npm audit (SCA)
        run: npm audit --audit-level=high

  containers:
    name: Container build & scan (trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      # Report both images even if one fails.
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "aegis-${{ matrix.component }}:${{ github.sha }}" "${{ matrix.component }}"
      - name: Verify image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "aegis-${{ matrix.component }}:${{ github.sha }}")"
          echo "Configured user: ${user}"
          if [ -z "${user}" ] || [ "${user%%:*}" = "0" ] || [ "${user%%:*}" = "root" ]; then
            echo "::error::Image must run as a non-root user"; exit 1
          fi
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (Trivy v0.70.0)
        with:
          image-ref: aegis-${{ matrix.component }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          # Fail only on CVEs with a fix available. Unfixed base-image CVEs are tracked in
          # README "Known limitations" and fail this gate automatically once a fix ships.
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy config scan (Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (Trivy v0.70.0)
        with:
          scan-type: config
          scan-ref: ${{ matrix.component }}
          severity: CRITICAL,HIGH
          exit-code: "1"
