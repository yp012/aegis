name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint, types, SAST, SCA, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-jwt-secret-key-not-used-anywhere-else
      BADGE_HMAC_SECRET: ci-only-badge-hmac-secret-not-used-anywhere
      MFA_ENCRYPTION_KEY: Y2ktb25seS1mZXJuZXQta2V5LW5vdC1mb3ItcHJvZC0=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy app tests
      - name: Bandit (SAST)
        run: bandit -c pyproject.toml -r app
      - name: pip-audit (SCA)
        run: pip-audit -r requirements.txt --strict
      - name: Pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint, build, SCA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: npm audit (SCA)
        run: npm audit --audit-level=high

  containers:
    name: Container build & scan (trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aegis-${{ matrix.component }}:${{ github.sha }} ${{ matrix.component }}
      - name: Verify image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' aegis-${{ matrix.component }}:${{ github.sha }})"
          echo "Configured user: ${user}"
          if [ -z "${user}" ] || [ "${user%%:*}" = "0" ] || [ "${user%%:*}" = "root" ]; then
            echo "::error::Image must run as a non-root user"; exit 1
          fi
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aegis-${{ matrix.component }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy config scan (Dockerfile)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.component }}
          severity: CRITICAL,HIGH
          exit-code: "1"
